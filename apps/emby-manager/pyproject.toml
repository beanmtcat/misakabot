[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misaka-emby-service"
version = "0.1.0"
description = "Standalone Emby user and watch-log management service"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.2,<5",
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4.0",
  "pypinyin>=0.53,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.scripts]
emby-manager-api = "emby_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]
