[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misakabot"
version = "0.1.0"
description = "Telegram 广告与群控账号审核机器人"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.0,<4.0",
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["basedpyright>=1.31,<2"]

[project.scripts]
misakabot = "misakabot.main:main"
misakabot-api = "misakabot.main:run_audit_api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misakabot = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
