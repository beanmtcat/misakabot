x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

x-app-environment: &app-environment
  <<: *database-environment
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
  TELEGRAM_TRANSPORT: webhook
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:?Set TELEGRAM_WEBHOOK_URL in .env}
  BOT_API_HOST: 0.0.0.0
  BOT_API_PORT: "8081"
  JOIN_VERIFY_URL: ${JOIN_VERIFY_URL:?Set JOIN_VERIFY_URL in .env}
  AUDIT_WEB_APP_URL: ${AUDIT_WEB_APP_URL:?Set AUDIT_WEB_APP_URL in .env}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY in .env}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env}
  ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set ADMIN_USER_IDS in .env}
  ALLOWED_GROUP_IDS: ${ALLOWED_GROUP_IDS:?Set ALLOWED_GROUP_IDS in .env}
  LLM_MODE: kimi_coding
  LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
  LLM_MODEL: ${LLM_MODEL:-}
  KIMI_API_BASE_URL: ${KIMI_API_BASE_URL:-https://api.kimi.com/coding/v1}
  KIMI_API_KEY: ${KIMI_API_KEY:?Set KIMI_API_KEY in .env}
  KIMI_MODEL: ${KIMI_MODEL:-k3}
  BOT_REPLY_ENABLED: "true"
  DMIT_KNOWLEDGE_GROUP_IDS: ${DMIT_KNOWLEDGE_GROUP_IDS:?Set DMIT_KNOWLEDGE_GROUP_IDS in .env}
  DMIT_CHANNEL_GROUP_IDS: ${DMIT_CHANNEL_GROUP_IDS:?Set DMIT_CHANNEL_GROUP_IDS in .env}
  DMIT_NEWS_CHANNEL_URL: ${DMIT_NEWS_CHANNEL_URL:-https://t.me/dmitnews}
  JOIN_VERIFICATION_TTL_MINUTES: "5"
  SECONDARY_VERIFICATION_TTL_MINUTES: "2"
  AUDIT_API_HOST: 127.0.0.1
  AUDIT_API_PORT: "8080"
  LOG_LEVEL: INFO
  AUTO_BAN_THRESHOLD: "0.90"
  REVIEW_THRESHOLD: "0.60"

x-emby-service-environment: &emby-service-environment
  <<: *database-environment
  EMBY_BASE_URL: ${EMBY_BASE_URL:?Set EMBY_BASE_URL in .env}
  EMBY_WEB_BASE_URL: ${EMBY_WEB_BASE_URL:?Set EMBY_WEB_BASE_URL in .env}
  EMBY_API_KEY: ${EMBY_API_KEY:?Set EMBY_API_KEY in .env}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  SESSION_HTTPS_ONLY: "true"
  EMBY_API_HOST: 0.0.0.0
  EMBY_API_PORT: "8084"
  EMBY_USER_SYNC_INTERVAL_SECONDS: "1800"
  EMBY_WATCH_SYNC_INTERVAL_SECONDS: "60"
  TMDB_API_TOKEN: ${TMDB_API_TOKEN:?Set TMDB_API_TOKEN in .env}
  EMBY_TRACKING_SYNC_INTERVAL_SECONDS: "21600"
  MOVIEPILOT_BASE_URL: ${MOVIEPILOT_BASE_URL:?Set MOVIEPILOT_BASE_URL in .env}
  MOVIEPILOT_API_TOKEN: ${MOVIEPILOT_API_TOKEN:?Set MOVIEPILOT_API_TOKEN in .env}
  MOVIEPILOT_SQLITE_PATH: /moviepilot-config/user.db
  MOVIEPILOT_SYNC_INTERVAL_SECONDS: "1800"
  EMBY_PATH_MAP_API_SECRET: ${EMBY_PATH_MAP_API_SECRET:?Set EMBY_PATH_MAP_API_SECRET in .env}

services:
  misaka-bot:
    build:
      context: ./apps/bot
      network: host
    container_name: misaka-bot
    user: "10001:10001"
    environment: *app-environment
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"

  audit-api:
    build:
      context: ./apps/bot
      network: host
    container_name: audit-api
    user: "10001:10001"
    command: ["misakabot-api"]
    environment:
      <<: *app-environment
      AUDIT_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    profiles: ["audit"]

  audit-ui:
    build:
      context: ./apps/audit-miniapp
      network: host
    container_name: audit-ui
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    profiles: ["audit"]

  emby-service:
    build:
      context: ./apps/emby-manager
      network: host
    container_name: emby-service
    user: "10001:10001"
    environment: *emby-service-environment
    ports:
      - "127.0.0.1:8084:8084"
    restart: unless-stopped
    volumes:
      - /data/moviepilotv2/moviepilot:/moviepilot-config:ro
    profiles: ["emby"]

networks:
  default:
    external: true
    name: docker_default
